<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdeaFlow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-brand">
        <h1>💡 IdeaFlow</h1>
        <p class="tagline">Capture, track, and execute your best ideas</p>
      </div>
      <form id="idea-form" class="idea-form">
        <div class="form-inputs">
          <div class="field-container title-field-container">
            <div class="input-with-button-wrapper">
              <input
                type="text"
                id="idea-title"
                placeholder="Core idea (short & punchy)..."
                required
                autocomplete="off"
              />
              <button type="button" id="telegram-ai-trigger" class="btn-telegram-ai" title="Fix with AI">✨ AI</button>
            </div>
            <div class="field-meta">
              <span id="title-error" class="field-error-text" style="display: none;">Maximum 60 characters allowed</span>
              <span id="title-char-count" class="char-count">0/60</span>
            </div>
          </div>

          <div class="field-container desc-field-container">
            <textarea
              id="idea-desc"
              rows="1"
              maxlength="500"
              placeholder="Detailed explanation, notes, or context..."
            ></textarea>
            <div class="field-meta">
              <span id="desc-char-count" class="char-count">0/500</span>
            </div>
          </div>

          <div class="date-inputs-group">
            <div class="date-input-wrap">
              <span class="date-tag">Start</span>
              <input type="date" id="idea-start-date" aria-label="Start Date" />
            </div>
            <div class="date-input-wrap">
              <span class="date-tag">Target</span>
              <input type="date" id="idea-end-date" aria-label="Target Date" />
            </div>
          </div>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary">Add Idea</button>
      </form>
    </header>

    <main class="kanban-board">
      <section class="kanban-column" data-status="todo">
        <div class="column-header">
          <div class="column-title">
            <span class="column-icon">💡</span>
            <h2>Ideas</h2>
          </div>
          <span class="column-count" id="count-todo">0</span>
        </div>
        <div class="card-list" id="list-todo"></div>
      </section>

      <section class="kanban-column" data-status="in-progress">
        <div class="column-header">
          <div class="column-title">
            <span class="column-icon">⚡</span>
            <h2>In Progress</h2>
          </div>
          <span class="column-count" id="count-in-progress">0</span>
        </div>
        <div class="card-list" id="list-in-progress"></div>
      </section>

      <section class="kanban-column" data-status="completed">
        <div class="column-header">
          <div class="column-title">
            <span class="column-icon">✅</span>
            <h2>Completed</h2>
          </div>
          <span class="column-count" id="count-completed">0</span>
        </div>
        <div class="card-list" id="list-completed"></div>
      </section>
    </main>

    <dialog id="idea-modal" class="modal">
      <div class="modal-card">
        <div class="modal-top">
          <div class="modal-meta">
            <span id="modal-status" class="badge"></span>
            <span id="modal-date" class="modal-date"></span>
          </div>
          <button type="button" id="modal-close" class="modal-close-btn" aria-label="Close modal">✕</button>
        </div>
        <h2 id="modal-title" class="modal-title"></h2>
        <div class="modal-dates" id="modal-dates-wrap">
          <div class="modal-date-item">
            <span class="date-label">Start Date:</span>
            <span class="date-value" id="modal-start-date">—</span>
          </div>
          <div class="modal-date-item">
            <span class="date-label">Target Date:</span>
            <span class="date-value" id="modal-end-date">—</span>
          </div>
          <div id="modal-countdown-wrap"></div>
        </div>
        <div class="modal-body">
          <p id="modal-description" class="modal-description"></p>
        </div>
      </div>
    </dialog>

    <dialog id="telegram-ai-modal" class="telegram-modal">
      <div class="telegram-modal-card">
        <div class="telegram-modal-header">
          <h2 class="telegram-modal-title">AI Editor</h2>
          <button type="button" id="telegram-ai-close" class="telegram-close-btn" aria-label="Close">✕</button>
        </div>

        <div class="telegram-modal-body">
          <details id="telegram-original-accordion" class="telegram-accordion" open>
            <summary class="telegram-accordion-summary">
              <span>Original</span>
              <span class="telegram-chevron">⌄</span>
            </summary>
            <div id="telegram-original-text" class="telegram-original-content"></div>
          </details>

          <hr class="telegram-divider" />

          <div class="telegram-result-section">
            <span class="telegram-result-label">Result</span>
            <div class="telegram-result-wrapper">
              <div id="telegram-result-text" class="telegram-result-content"></div>
              <button type="button" id="telegram-copy-btn" class="telegram-copy-btn">📋 Copy</button>
            </div>
          </div>
        </div>

        <div class="telegram-modal-footer">
          <button type="button" id="telegram-apply-btn" class="telegram-apply-btn">Apply</button>
        </div>
      </div>
    </dialog>
  </div>

  <script src="app.js"></script>
</body>
</html>
